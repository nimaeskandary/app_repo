# this project uses https://vektra.github.io/mockery for go mocks
# to mark an interface for mock generation, add the comment `//mockery:generate: true` above it
# to generate mocks, run `bin/generate-mocks.sh`
# mocks will be generated in a `mocks/` subfolder in the package of the interface, e.g. `pkg/database/go/types/mocks`

template: testify
all: false
recursive: true
dir: "{{.InterfaceDir}}/mocks"
pkgname: '{{.SrcPackageName}}_mocks'
filename: '{{.SrcPackageName}}_mocks.go'
packages:
  github.com/nimaeskandary/app_repo:
